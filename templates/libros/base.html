{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Biblioteca Academica{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f7f9; }
    .navbar { background: #17324d; }
    .brand-mark { color: #f4c95d; }
    .hero { background: linear-gradient(135deg, #17324d, #28666e); color: white; }
    .table thead th { background: #e7eef2; color: #17324d; }
    .card { border: 0; box-shadow: 0 8px 24px rgba(23, 50, 77, .08); }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'libros:listar' %}"><span class="brand-mark">+</span> Biblioteca Academica</a>
    <a class="btn btn-warning btn-sm fw-semibold" href="{% url 'libros:crear' %}">Registrar libro</a>
  </div>
</nav>
<main class="container pb-5">
  {% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button></div>{% endfor %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
