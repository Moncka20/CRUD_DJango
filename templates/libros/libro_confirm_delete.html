{% extends 'libros/base.html' %}

{% block title %}Eliminar {{ libro.titulo }} | Biblioteca Academica{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card border-danger">
      <div class="card-body p-4 p-md-5">
        <p class="text-danger fw-semibold">CONFIRMAR ELIMINACION</p>
        <h1 class="h3">¿Eliminar este libro?</h1>
        <p class="text-muted">Se eliminara <strong>{{ libro.titulo }}</strong> de forma permanente.</p>
        
        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2">
            <button class="btn btn-danger" type="submit">Si, eliminar</button>
            <a class="btn btn-outline-secondary" href="{% url 'libros:detalle' libro.pk %}">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
